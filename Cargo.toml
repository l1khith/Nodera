[workspace]
resolver = "2"
members = [
    "crates/nodera-core",
    "crates/nodera-markdown",
    "crates/nodera-index",
    "crates/nodera-pdf",
    "crates/nodera-desktop",
    "crates/nodera-cli",
    "crates/nodera-parser-core",
    "crates/nodera-project",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Nodera Contributors"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
nodera-core = { path = "crates/nodera-core" }
nodera-markdown = { path = "crates/nodera-markdown" }
nodera-index = { path = "crates/nodera-index" }
nodera-pdf = { path = "crates/nodera-pdf" }
nodera-parser-core = { path = "crates/nodera-parser-core" }
nodera-project = { path = "crates/nodera-project" }

toml = "0.8"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3.17"
tokio = { version = "1.43", features = ["full"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
dioxus = { version = "0.6", features = ["desktop"] }
rfd = "0.15"
pulldown-cmark = "0.13"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.22"
lopdf = "0.45"
regex = "1.11"
notify = "8.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
rayon = "1.10"
aes-gcm = "0.10"
sha2 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["simple"] }


