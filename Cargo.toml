[workspace]
resolver = "2"
members = [
    "crates/nodera-core",
    "crates/nodera-markdown",
    "crates/nodera-index",
    "crates/nodera-pdf",
    "crates/nodera-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nodera Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nodera-core = { path = "crates/nodera-core" }
nodera-markdown = { path = "crates/nodera-markdown" }
nodera-index = { path = "crates/nodera-index" }
nodera-pdf = { path = "crates/nodera-pdf" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3.17"
tokio = { version = "1.43", features = ["full"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
dioxus = { version = "0.6", features = ["desktop"] }
rfd = "0.15"
pulldown-cmark = "0.13"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.22"
lopdf = "0.45"
regex = "1.11"
notify = "8.0"
